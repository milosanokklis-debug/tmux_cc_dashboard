services:
  ccdash:
    # Pulled from ghcr.io. To build locally instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ghcr.io/milosanokklis-debug/ccdash:${CCDASH_VERSION:?set CCDASH_VERSION in .env}
    container_name: ccdash
    restart: unless-stopped
    # gVisor: off unless CCDASH_RUNTIME=runsc is set in .env; `ccd doctor --live` decides (NOTES.md, Phase F: gVisor)
    runtime: ${CCDASH_RUNTIME:-}
    read_only: true
    environment:
      CCDASH_ORIGIN: ${CCDASH_ORIGIN:-}
      # Seconds to wait for an approval; empty or unset = 120 (broker.js and permission.sh both fall back)
      CCDASH_APPROVAL_WAIT: ${CCDASH_APPROVAL_WAIT:-}
    tmpfs:
      - /run:mode=0755,exec
      - /tmp:mode=1777
    volumes:
      - ccdash-home:/home/ccd
      - ccdash-workspace:/workspace
      - ccdash-web:/var/lib/ccdash-web
      - ccdash-git:/var/lib/ccdash-git
    ports:
      - "127.0.0.1:7690:7690"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 8g
    cpus: 4

volumes:
  ccdash-home:
  ccdash-workspace:
  ccdash-web:
  ccdash-git:
