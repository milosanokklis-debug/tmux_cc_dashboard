name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: checks (shellcheck, dashboard, docs, fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq tmux
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          for f in $(git ls-files); do
            case $f in *.sh | *.md | *.json | *.js) continue ;; esac
            [ -f "$f" ] && head -c 64 "$f" | head -n 1 | grep -Eq '^#!.*(/|env )(ba)?sh' && files="$files $f"
          done
          # shellcheck disable=SC2086
          shellcheck $files
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: dashboard tests
        run: cd dashboard && npm ci && npm test
      - name: docs check
        run: tests/docs-check.sh
      - name: replay fixtures
        run: tests/replay-fixtures.sh

  bats:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats jq tmux shellcheck parallel
      - name: bats (parallel)
        run: bats --jobs "$(nproc)" tests/bats

  stack:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: stack (phase-b), script: phase-b }
          - { name: stack (phase-c), script: phase-c }
          - { name: stack (phase-d), script: phase-d }
          - { name: stack (phase-e core), script: phase-e, part: core }
          - { name: stack (phase-e cpu), script: phase-e, part: cpu }
          - { name: stack (phase-e ui), script: phase-e, part: ui }
          - { name: stack (project-isolation), script: project-isolation }
          - { name: stack (phase-g), script: phase-g }
          - { name: stack (egress), script: egress }
          - { name: stack (kit-attach), script: kit-attach }
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned versions
        run: |
          set -eu
          grep -E '^(CLAUDE_CODE_VERSION|S6_OVERLAY_VERSION|BASIC_MEMORY_VERSION|KIT_REPO|KIT_REF)=' .env.example >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build main image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ccdash:ci
          # read-only: image.yml writes scope image-amd64 (avoids the matrix legs racing the same cache write)
          cache-from: type=gha,scope=image-amd64
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            BASIC_MEMORY_VERSION=${{ env.BASIC_MEMORY_VERSION }}
            KIT_REPO=${{ env.KIT_REPO }}
            KIT_REF=${{ env.KIT_REF }}
      - name: Stack test
        env:
          PHASE_E_PART: ${{ matrix.part }}
        run: tests/stack/${{ matrix.script }}.sh

  fake-claude-image:
    name: build fake-claude test image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile.fake-claude
          load: true
          tags: ccdash-fake-claude:ci
          cache-from: type=gha,scope=fake-claude
          cache-to: type=gha,mode=max,scope=fake-claude

  test:
    needs: [checks, bats, stack, fake-claude-image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "a required job did not succeed"
            exit 1
          fi
