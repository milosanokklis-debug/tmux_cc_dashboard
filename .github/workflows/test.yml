name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq tmux
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          for f in $(git ls-files); do
            case $f in *.sh | *.md | *.json | *.js) continue ;; esac
            [ -f "$f" ] && head -c 64 "$f" | head -n 1 | grep -Eq '^#!.*(/|env )(ba)?sh' && files="$files $f"
          done
          # shellcheck disable=SC2086
          shellcheck $files
      - name: bats
        run: bats tests/bats
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dashboard tests
        run: cd dashboard && npm ci && npm test
      - name: replay fixtures
        run: tests/replay-fixtures.sh
      - name: build main image
        run: |
          set -a; . ./.env.example; set +a
          docker build \
            --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" \
            --build-arg "S6_OVERLAY_VERSION=$S6_OVERLAY_VERSION" \
            -t ccdash:ci .
      - name: stack test (compose restart, wake)
        run: tests/stack/phase-b.sh
      - name: stack test (controls, approvals, push; headless Chromium at a phone viewport)
        run: tests/stack/phase-c.sh
      - name: stack test (re-onboarding, pull, git identity)
        run: tests/stack/phase-d.sh
      - name: stack test (reader service, gauges, tokens, load, headless Chromium)
        run: tests/stack/phase-e.sh
      - name: stack test (egress allowlist proxy, internal network, push and git through it)
        run: tests/stack/egress.sh
      - name: build test image
        run: docker build -f tests/Dockerfile.fake-claude -t ccdash-fake-claude:ci .
