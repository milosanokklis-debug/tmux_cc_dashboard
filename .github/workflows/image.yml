name: image
# Tag v0.1.1 publishes ghcr.io/milosanokklis-debug/ccdash:0.1.1 and :latest (multi-arch).
# The tag keeps its "v" in git; the image tag drops it, because compose uses CCDASH_VERSION=0.1.1.
# Every run first builds one leg per architecture (arm64 on a native runner) with a smoke test (no push); publish needs both legs to pass.
# Tags with a '-' (v1.0.0-rc1) are not published.
# Main pushes only warm the gha build cache; publish runs only on v-tags.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    paths:
      - Dockerfile
      - rootfs/**
      - dashboard/**
      - egress/**
      - .env.example
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/milosanokklis-debug/ccdash
jobs:
  dry-run:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned versions
        run: |
          set -eu
          grep -E '^(CLAUDE_CODE_VERSION|S6_OVERLAY_VERSION|BASIC_MEMORY_VERSION|KIT_REPO|KIT_REF)=' .env.example >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ccdash:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            BASIC_MEMORY_VERSION=${{ env.BASIC_MEMORY_VERSION }}
            KIT_REPO=${{ env.KIT_REPO }}
            KIT_REF=${{ env.KIT_REF }}
      - name: Smoke test (arch, tools)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          docker run --rm --platform "$PLATFORM" --entrypoint sh ccdash:smoke -c \
            'uname -m; node --version; claude --version'
      # Does the dashboard come up and answer /healthz (natively on each runner, including arm64)?
      - name: Smoke test (/healthz)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          docker run -d --name smoke --platform "$PLATFORM" --read-only \
            --tmpfs /run:mode=0755,exec --tmpfs /tmp:mode=1777 ccdash:smoke >/dev/null
          ok=0
          for _ in $(seq 1 60); do
            if docker exec smoke curl -sf http://127.0.0.1:7690/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then docker logs smoke || true; exit 1; fi
          echo "healthz ok on $PLATFORM"
          docker rm -f smoke >/dev/null
      # Rootless Docker maps only uid/gid 0-65535, so any file owned above that breaks the pull.
      - name: Check file owners (rootless Docker)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          bad=$(docker run --rm --platform "$PLATFORM" --entrypoint sh ccdash:smoke -c 'find / -xdev \( -uid +65535 -o -gid +65535 \) -print 2>/dev/null | head -20')
          if [ -n "$bad" ]; then
            echo "Files with uid/gid > 65535 (rootless Docker cannot pull these):"
            echo "$bad"
            exit 1
          fi
          echo "owners ok on $PLATFORM"

      # Fixed ids (web 999, ccd 1000) keep volume owners stable across upgrades; see Dockerfile.
      - name: Check fixed user ids (web 999, ccd 1000)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          ids=$(docker run --rm --platform "$PLATFORM" --entrypoint sh ccdash:smoke -c 'echo "$(id -u web) $(id -g web) $(id -u ccd) $(id -g ccd)"')
          if [ "$ids" != "999 999 1000 1000" ]; then
            echo "web uid/gid and ccd uid/gid are '$ids', want '999 999 1000 1000'"
            exit 1
          fi
          echo "user ids ok on $PLATFORM"

  publish:
    needs: dry-run
    # pre-release tags such as v1.0.0-rc1 match the glob but are not published
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned versions and compute the version
        run: |
          set -eu
          grep -E '^(CLAUDE_CODE_VERSION|S6_OVERLAY_VERSION|BASIC_MEMORY_VERSION|KIT_REPO|KIT_REF)=' .env.example >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            BASIC_MEMORY_VERSION=${{ env.BASIC_MEMORY_VERSION }}
            KIT_REPO=${{ env.KIT_REPO }}
            KIT_REF=${{ env.KIT_REF }}
